[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devguard"
version = "0.1.0"
description = "Lightweight developer security scanner"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DevGuard Team" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
